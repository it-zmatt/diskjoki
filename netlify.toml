[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# ffmpeg.wasm needs a cross-origin isolated page, same as vite.config.ts.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
